function home(){streak();const h=new Date().getHours(),g=h<12?"Good morning":h<17?"Good afternoon":"Good evening",x=S.xp%500,b=Object.keys(S.badges).length;
let h5='<h1>'+g+'! 🌏</h1><p>'+TEACHER_NOTE+'</p><div class="card stats"><div class="stat"><b>Lv '+lvl(S.xp)+'</b>Level</div><div class="stat"><b>'+S.xp+'</b>XP</div><div class="stat"><b>🔥 '+S.streak+'</b>Day streak</div><div class="stat"><b>'+b+'/'+BADGES.length+'</b>Badges</div></div><div class="bar"><i style="width:'+x/5+'%"></i></div><small>'+(500-x)+' XP to next level</small>';
const nx=T.find(t=>!S.boss[t.id])||T[0],st=t=>t.cards.some((c,i)=>S.known[t.id+i])||S.boss[t.id]||(S.prog[t.id]||{}).t;
h5+='<div class="card" style="background:#f0e3d0;text-align:center"><h2>Start here 👇</h2><p>Follow the learning path below, one topic at a time.</p><button class="btn p" style="text-align:center;font-size:1.2em" onclick="topic(\''+nx.id+'\')">▶ '+(st(nx)?"Continue":"Start")+': '+nx.name+'</button></div><h2>Your learning path</h2>';
T.forEach((t,i)=>{const k=t.cards.filter((c,j)=>S.known[t.id+j]).length,pc=Math.round(k/t.cards.length*100),lab=S.boss[t.id]?"✅ Complete":t===nx?"▶ Up next":"Not started";h5+='<div class="card" style="border-left:8px solid '+t.col+';cursor:pointer" onclick="topic(\''+t.id+'\')"><span class="pill">Topic '+(i+1)+'</span> <span class="pill">'+lab+'</span><h3>'+t.ic+' '+t.name+'</h3><p>'+t.intro[LV()]+'</p><div class="bar"><i style="width:'+pc+'%"></i></div><small>'+pc+'% of flashcards mastered</small></div>'});
h5+='</div><p>Reading level: <span class="pill">'+LVN[LV()]+'</span> <button class="opt" style="width:auto;display:inline-block" onclick="S.eng=\'\';save();gate()">Change</button></p>';$("app").innerHTML=h5}
const step=(n,h,d,b)=>'<div class="card"><h3><span class="pill">Step '+n+'</span> '+h+'</h3><p>'+d+'</p>'+b+'</div>';
const step5=id=>{const K=T5[id],l=LV(),d=K[l],tp=SUBMIT[id]?'<a class="btn" target="_blank" rel="noopener" href="'+SUBMIT[id]+'">📄 Open the template (make your own copy)</a>':'<div class="btn off">📄 Template (coming soon)</div>';
return step(5,"Submit to Daymap","<b>"+K.t+"</b> <span class=\"pill\">"+LVN[l]+" level</span><br>Submit to Daymap under the task name <b>Week 1 Work</b>.",'<p>'+d[0]+'</p>'+(d[2]?'<div class="card" style="background:#eef2e6"><b>Help box</b><br>'+d[2]+'</div>':'')+'<b>Checklist before you submit</b>'+d[1].map((c,i)=>'<label style="display:block;margin:6px 0"><input type="checkbox" '+(S.chk[id+l+i]?"checked":"")+' onchange="chk(\''+id+l+i+'\',this.checked)"> '+c+'</label>').join("")+tp+'<button class="btn" onclick="subm(\''+id+'\')">'+(S.sub[id]?"✅ Submitted":"I have submitted this (+50 XP)")+'</button>')};
function chk(k,v){S.chk[k]=v?1:0;save()}
function subm(id){if(!S.sub[id]){S.sub[id]=1;xp(50)}save();topic(id)}
function topic(id){const t=T.find(x=>x.id===id),i=T.indexOf(t),r=RES[id],L=LINKS[id]||[],k=t.cards.filter((c,j)=>S.known[id+j]).length,nt=T[i+1];S.lastAct=id;save();cur="topic";document.querySelectorAll("nav button").forEach(b=>b.classList.remove("on"));
$("app").innerHTML='<button class="opt" style="width:auto" onclick="go(\'home\')">← Back to learning path</button><h1>'+t.ic+' Topic '+(i+1)+': '+t.name+'</h1><p>'+t.intro[LV()]+'</p>'
+step(1,"Learn","Read or watch the lesson.",(r.slides?'<a class="btn p" target="_blank" rel="noopener" href="'+r.slides+'">📊 Open slides</a>':(r.video?"":'<div class="btn off">📊 Lesson (coming soon)</div>'))+(r.video?'<a class="btn p" target="_blank" rel="noopener" href="'+r.video+'">🎬 Watch the video</a>':""))
+step(2,"Explore","Try these interactive activities. They open in a new tab.",L.map(l=>'<a class="btn" target="_blank" rel="noopener" href="'+l[1]+'">'+l[0]+'<br><small>'+l[2]+'</small></a>').join("")||'<div class="btn off">Activities coming soon</div>')
+step(3,"Practise","Flashcards mastered: "+k+" of "+t.cards.length,'<button class="btn p" onclick="flash(\''+id+'\')">🃏 Flashcards</button>')
+step(4,"Boss battle",S.boss[id]?"✅ Boss defeated!":"Get 4 out of 5 to finish this topic.",'<button class="btn p" onclick="boss(\''+id+'\')">⚔️ '+(S.boss[id]?"Fight again":"Fight the boss")+'</button>')
+step5(id)
+(S.boss[id]&&nt?'<button class="btn p" style="text-align:center" onclick="topic(\''+nt.id+'\')">Next topic: '+nt.name+' →</button>':"")}
function learn(){$("app").innerHTML='<h1>Learn</h1><div class="grid"><button class="btn p" onclick="flash()">🃏 Flashcards</button><button class="btn p" onclick="quiz()">⚡ Quick Quiz (10 questions)</button></div><h2>Boss Battles ⚔️</h2><p>Answer 4 out of 5 correctly to win. Worth a 100 XP bonus.</p><div class="grid">'+T.map(t=>'<button class="btn" style="background:'+t.col+'55" onclick="boss(\''+t.id+'\')">'+t.ic+' '+t.name+(S.boss[t.id]?" ✅":"")+'</button>').join("")+'</div><p><small>More game modes are coming soon.</small></p>'}
let fl={};
function flash(tid){fl={tid:tid||"all",i:0,f:false};if(tid)S.lastAct=tid;fdeck()}
function fdeck(){fl.d=shuf(T.filter(t=>fl.tid==="all"||t.id===fl.tid).reduce((a,t)=>a.concat(t.cards.map((c,i)=>({t,c,k:t.id+i}))),[]));fl.i=0;fshow()}
function fshow(){const d=fl.d[fl.i];if(!d){$("app").innerHTML='<div class="card"><h2>Deck complete! 🎉</h2><button class="btn p" onclick="fdeck()">Go again</button><button class="btn" onclick="go(\'learn\')">Back</button></div>';return}
const def=LV()==="sup"?d.c[1]:d.c[2],ext=LV()==="ext"?"<br><small>Challenge: explain this using an example from a sphere interaction.</small>":"";
$("app").innerHTML='<h1>Flashcards</h1><select onchange="flash(this.value)"><option value="all">All topics</option>'+T.map(t=>'<option value="'+t.id+'"'+(t.id===fl.tid?" selected":"")+'>'+t.name+'</option>').join("")+'</select><p>Card '+(fl.i+1)+' of '+fl.d.length+'</p><div class="flip" onclick="this.classList.toggle(\'f\')"><div><p><b>'+d.c[0]+'</b></p><p>'+def+ext+'</p></div></div><p><small>Tap the card to flip it.</small></p><div class="grid"><button class="btn p" onclick="fgo(1)">✅ Got it</button><button class="btn" onclick="fgo(0)">🔁 Still learning</button></div>'}
function fgo(ok){const d=fl.d[fl.i];if(ok){if(!S.known[d.k]){S.known[d.k]=1;xp(10)}}else delete S.known[d.k];save();fl.i++;fshow()}
let Q={};
function quiz(){Q={list:shuf(tag()).slice(0,10),i:0,c:0,xp:12,name:"Quick Quiz"};qshow()}
function boss(id){const t=T.find(x=>x.id===id);S.lastAct=id;Q={list:shuf(t.qs.map(q=>({tid:id,q}))),i:0,c:0,xp:15,name:"Boss: "+t.name,boss:id};qshow()}
function qshow(){const it=Q.list[Q.i];if(!it){const w=Q.boss&&Q.c>=4;if(w&&!S.boss[Q.boss]){S.boss[Q.boss]=1;xp(100)}if(!Q.boss&&Q.c===Q.list.length){S.perfect=true;xp(0)}save();
$("app").innerHTML='<div class="card"><h2>'+(Q.boss?(w?"Boss defeated! ⚔️ +100 XP":"The boss survived. Try again!"):"Quiz complete!")+'</h2><p>Score: '+Q.c+' / '+Q.list.length+'</p><button class="btn p" onclick="'+(Q.boss?"boss('"+Q.boss+"')":"quiz()")+'">Play again</button><button class="btn" onclick="go(\'learn\')">Back</button></div>';return}
const t=T.find(x=>x.id===it.tid),ord=shuf(it.q[1].map((o,i)=>[o,i]));
$("app").innerHTML='<h1>'+Q.name+'</h1><div class="bar"><i style="width:'+Q.i/Q.list.length*100+'%"></i></div><div class="card"><span class="pill">'+t.name+'</span><h3>'+it.q[0]+'</h3><div id="o">'+ord.map((o,i)=>'<button class="opt" data-i="'+o[1]+'">'+o[0]+'</button>').join("")+'</div><p id="fb"></p></div>';
document.querySelectorAll("#o .opt").forEach(b=>b.onclick=()=>{const ok=+b.dataset.i===it.q[2];document.querySelectorAll("#o .opt").forEach(x=>{x.disabled=true;if(+x.dataset.i===it.q[2])x.classList.add("ok")});if(!ok)b.classList.add("no");rec(it.tid,ok);if(ok){Q.c++;xp(Q.xp)}else save();$("fb").innerHTML=(ok?"✅ Correct! ":"❌ Not quite. ")+it.q[3]+'<br><button class="btn p" onclick="Q.i++;qshow()">Next</button>'})}
function res(){$("app").innerHTML='<h1>Resources</h1><div class="grid">'+T.map(t=>{const r=RES[t.id];return'<div class="card" style="border-top:6px solid '+t.col+'"><h3>'+t.ic+' '+t.name+'</h3>'+[["slides","📊 Slides"],["video","🎬 Video"],["test","📝 Practice test"],["answers","✅ Test answers"]].map(x=>r[x[0]]?'<a class="btn" target="_blank" rel="noopener" href="'+r[x[0]]+'">'+x[1]+'</a>':'<div class="btn off">'+x[1]+' (coming soon)</div>').join("")+(LINKS[t.id]||[]).map(l=>'<a class="btn" target="_blank" rel="noopener" href="'+l[1]+'">'+l[0]+'</a>').join("")+'<button class="btn" onclick="flash(\''+t.id+'\')">🃏 Flashcards</button><button class="btn" onclick="boss(\''+t.id+'\')">⚔️ Boss battle</button></div>'}).join("")+'</div>'}
function task(){$("app").innerHTML='<h1>Tasks</h1>'+TASKS.map(t=>'<details><summary>'+t.name+' <span class="pill">'+t.type+'</span></summary><p><b>Topic:</b> '+t.topic+'<br><b>Conditions:</b> '+t.cond+'</p><p>'+t.detail+'</p>'+(t.link?'<a class="btn p" target="_blank" rel="noopener" href="'+t.link+'">Open task sheet</a>':"")+'</details>').join("")}
function prog(){$("app").innerHTML='<h1>My Progress</h1>'+T.map(t=>{const p=S.prog[t.id]||{c:0,t:0},a=p.t?Math.round(p.c/p.t*100):0;return'<div class="card"><b>'+t.ic+' '+t.name+'</b><div class="bar"><i style="width:'+a+'%;background:'+t.col+'"></i></div><small>'+a+'% accuracy ('+p.c+' of '+p.t+' answers)</small></div>'}).join("")+'<h2>Badges</h2><div class="grid">'+BADGES.map(b=>'<div class="badge'+(S.badges[b[1]]?"":" lock")+'"><div style="font-size:2em">'+b[0]+'</div><b>'+b[1]+'</b><br><small>'+b[2]+'</small></div>').join("")+'</div>'}
if(!S.eng)gate();go("home");
</script></body></html>
