const okTerm=(v,acc)=>{v=NORM(v);return acc.some(a=>{a=NORM(a);return v===a||(a.length>=7&&lev(v,a)<=1)})};
const okNum=(v,n)=>{const x=parseFloat(String(v).replace(/,/g,""));return !isNaN(x)&&Math.abs(x-n)<1e-9};

function res(){$("app").innerHTML='<h1>Resources</h1><div class="grid">'+T.map(t=>{const r=RES[t.id];return'<div class="card" style="border-top:6px solid '+t.col+'"><h3>'+t.ic+' '+t.name+'</h3>'+[["slides","📊 Slides"],["video","🎬 Video"],["test","📝 Practice test"],["answers","✅ Test answers"]].map(x=>r[x[0]]?'<a class="btn" target="_blank" rel="noopener" href="'+r[x[0]]+'">'+x[1]+'</a>':"").join("")+(LINKS[t.id]||[]).map(l=>'<a class="btn" target="_blank" rel="noopener" href="'+l[1]+'">'+l[0]+'</a>').join("")+'<button class="btn" onclick="flash(\''+t.id+'\')">🃏 Flashcards</button><button class="btn" onclick="boss(\''+t.id+'\')">⚔️ Boss battle</button></div>'}).join("")+'</div>'}
function prog(){$("app").innerHTML='<h1>My Progress</h1><p><small>Topic progress is an estimate, not a grade. It combines your first closed-book checkpoint (50%), first-attempt accuracy on different practice questions (25%, needs at least '+W(EV_MIN)+' different questions), the boss battle (15%) and flashcards you rate Got it (10%). Until a checkpoint is done, progress cannot go above half. XP shows effort and practice, not understanding. XP is earned once per question, for a correct first attempt. Number-changing questions earn XP once per question type, but each new set of numbers counts as a new first attempt for accuracy. A streak day needs '+W(GOAL)+' learning actions: answering questions or rating flashcards.</small></p>'+T.map(t=>{const p=S.prog[t.id]||{c:0,t:0},e=ev(t),f=e.f,r=S.retry[t.id]||{c:0,t:0},pc=x=>x.t?Math.round(x.c/x.t*100)+"%":"none yet";return'<div class="card"><b>'+t.ic+' '+t.name+'</b> <span class="pill">'+e.pct+'% progress</span> <span class="pill">'+e.label+'</span><div class="bar"><i style="width:'+e.pct+'%;background:'+t.col+'"></i></div><small>First-attempt accuracy: '+pc(f)+' ('+W(f.t)+' different questions) | All attempts: '+pc(p)+' | Corrected after feedback: '+W(r.c)+' of '+W(r.t)+'</small></div>'}).join("")+'<h2>Badges</h2><div class="grid">'+BADGES.map(b=>'<div class="badge'+(S.badges[b[1]]?"":" lock")+'"><div style="font-size:2em">'+b[0]+'</div><b>'+b[1]+'</b><br><small>'+b[2]+'</small></div>').join("")+'</div>'}

const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function who(){const b=$("who");if(b)b.textContent="👤 "+(S.name||"Profile")}
function copyTxt(id){const t=$(id);t.select();const ok=()=>toast("Copied");try{navigator.clipboard.writeText(t.value).then(ok,()=>{document.execCommand("copy");ok()})}catch(e){try{document.execCommand("copy");ok()}catch(x){toast("Select the text and copy it")}}}
async function saveText(name,text,mime){name=name.replace(/[^\w. -]/g,"_");
if(window.claude){try{let d=await claude.use("downloads");if(!d){const pm=await claude.use("permissions");if(pm&&await pm.state("downloads")==="prompt"){await pm.request(["downloads"]);d=await claude.use("downloads")}}if(d){await d.save({filename:name,data:text});return}}catch(e){}}
try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:mime}));a.download=name;document.body.append(a);a.click();a.remove()}catch(e){toast("Downloads are not available here. Copy the code instead.")}}
function report(){const t={};T.forEach(x=>{const e=ev(x),p=S.prog[x.id]||{c:0,t:0},f=S.fa[x.id]||{c:0,t:0},r=S.retry[x.id]||{c:0,t:0},k=S.cp[x.id];t[x.id]={p:e.pct,l:e.label,cp:k?[k.first.c,k.first.t,k.first.d,k.n]:null,ab:(S.cpab||{})[x.id]||0,fa:[f.c,f.t],al:[p.c,p.t],b:S.boss[x.id]?1:0,rt:[r.c,r.t]}});return{v:1,n:S.name||"",d:day(new Date()),lv:S.lvl||"",xp:S.xp,st:streakNow(),t}}
function summary(){const r=report();return["Carbon Cycle Hub results: "+r.n+" ("+r.d+")","Reading support: "+LVN[r.lv||"core"]+". XP: "+r.xp+". Streak: "+r.st+".",""].concat(T.map(t=>{const x=r.t[t.id];return t.name+": progress "+x.p+"% ("+x.l+"). Checkpoint: "+(x.cp?x.cp[0]+"/"+x.cp[1]+" on "+x.cp[2]:"not done")+". First attempts: "+x.fa[0]+"/"+x.fa[1]+" correct. Boss: "+(x.b?"defeated":"not yet")+"."}),["","Results code (paste into the teacher view):","RPT1:"+enc(r)]).join("\n")}
const fname=s=>(S.name||"student").replace(/[^\w-]+/g,"-");
function dlRes(){saveText(fname()+"-results.txt",summary(),"text/plain")}

function myData(){return`<h2>Share and back up</h2><div class="card"><b>Share your results with your teacher</b><p><small>Copy your results code or download a results file, then submit it as your teacher instructs. Your name is only shared when you do this.</small></p><textarea id="rc" class="opt" readonly rows="3">RPT1:${enc(report())}</textarea><button class="btn p" onclick="copyTxt('rc')">Copy results code</button><button class="btn" onclick="dlRes()">Download results file</button></div><div class="card"><b>Back up or restore your progress</b><p><small>Progress is saved on this device only. Keep a backup in case the browser is cleared or you change device.</small></p><textarea id="bc" class="opt" readonly rows="3">RB1:${enc(S)}</textarea><button class="btn" onclick="copyTxt('bc')">Copy backup code</button><button class="btn" onclick="dlBack()">Download backup file</button><textarea id="rs" class="opt" rows="2" placeholder="Paste a backup code here to restore it"></textarea><button class="btn" onclick="restoreCode($('rs').value)&&gate0()">Restore as a new profile</button></div>`}
function gate0(){who();if(!S.lvl)gate();else go("home")}
function restoreCode(c){const r=dec(String(c).trim().replace(/^RB1:/,""));if(!r||!r.ok||!r.o||typeof r.o.xp!=="number"){toast("That backup code is not valid.");return false}let n=r.o.name||"Restored";if(P.list.some(p=>p.name===n))n+=" (restored)";newProfile(n,r.o);return true}
function modal(h){const m=document.createElement("div");m.className="modal";m.setAttribute("role","dialog");m.setAttribute("aria-modal","true");m.innerHTML='<div class="card">'+h+'</div>';document.body.append(m);return m}
function welcome(){const m=modal(`<h2>Welcome! 👋</h2><p>Enter your name so your results can be shared with your teacher. It is saved only on this device.</p><input id="nm" class="opt" maxlength="40" placeholder="First name and last initial"><button class="btn p" id="ok">Continue</button><button class="btn" id="rs2">I have a backup code</button>`);
m.querySelector("#ok").onclick=()=>{const v=m.querySelector("#nm").value.trim();if(!v){toast("Please enter your name");return}newProfile(v);m.remove();who();gate()};
m.querySelector("#rs2").onclick=()=>{m.remove();const r=modal(`<h2>Restore progress</h2><textarea id="rt" class="opt" rows="4" placeholder="Paste your backup code"></textarea><button class="btn p" id="go">Restore</button><button class="btn" id="bk">Back</button>`);r.querySelector("#go").onclick=()=>{if(restoreCode(r.querySelector("#rt").value)){r.remove();gate0()}};r.querySelector("#bk").onclick=()=>{r.remove();welcome()}}}
function profMenu(){if(CPON){toast("Finish the checkpoint first");return}if(!P.list.length){welcome();return}const m=modal(`<h2>Profiles</h2><p><small>Profiles are saved only on this device.</small></p>`+P.list.map(p=>`<button class="btn${p.id===PID?" p":""}" data-id="${p.id}">👤 ${esc(p.name)}${p.id===PID?" (current)":""}</button>`).join("")+`<button class="btn" id="pa">➕ Add a profile</button><button class="btn" id="pb">💾 Share, back up or restore</button><button class="btn" id="pd">🗑 Delete this profile</button><button class="btn" id="px">Close</button>`);
m.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>{useProfile(b.dataset.id);m.remove();gate0()});
m.querySelector("#pa").onclick=()=>{m.remove();welcome()};m.querySelector("#pb").onclick=()=>{m.remove();go("prog")};m.querySelector("#px").onclick=()=>m.remove();
m.querySelector("#pd").onclick=()=>{if(!confirm("Delete the profile for "+S.name+"? This cannot be undone. Back it up first if you want to keep it."))return;try{localStorage.removeItem(KEY+":"+PID)}catch(e){}P.list=P.list.filter(p=>p.id!==PID);m.remove();if(P.list.length){useProfile(P.list[0].id);gate0()}else{PID="";P.active="";S=fresh();saveP();welcome()}}}
function teacher(){$("app").innerHTML=`<h1>Teacher tools</h1><p>Paste your students' results codes (one per line, or a whole message thread) or load results files they have saved. Everything stays in this browser and is not uploaded anywhere.</p><textarea id="tc" class="opt" rows="6" placeholder="RPT1:..."></textarea><p><input type="file" id="tf" multiple accept=".txt" onchange="readTf(this)"></p><button class="btn p" onclick="showClass()">Show class results</button><div id="cls"></div><p><small>Results codes have a simple check so casual edits are flagged. They are not tamper-proof, so treat them as evidence to discuss with the student, not as a secure record.</small></p>`}
function readTf(inp){[...inp.files].forEach(f=>{const r=new FileReader();r.onload=()=>{$("tc").value+="\n"+r.result};r.readAsText(f)})}
function showClass(){const m=$("tc").value.match(/RPT1:[A-Za-z0-9+\/=]+\.[0-9a-f]+/g)||[],by={};m.forEach(c=>{const r=dec(c.slice(5));if(!r||!r.o||!r.o.t)return;const k=(r.o.n||"?").toLowerCase();if(!by[k]||r.o.d>=by[k].o.d)by[k]=r});
const rows=Object.values(by).sort((a,b)=>(a.o.n||"").localeCompare(b.o.n||""));if(!rows.length){$("cls").innerHTML="<p>No valid results codes found.</p>";return}CLS=rows;
$("cls").innerHTML=`<h2>${W(rows.length)} student${rows.length>1?"s":""}</h2><div style="overflow:auto"><table class="tbl"><tr><th>Student</th><th>Support</th><th>Date</th><th>XP</th>${T.map(t=>`<th>${t.name}<br><small>checkpoint (progress)</small></th>`).join("")}<th>Code check</th></tr>${rows.map(r=>`<tr><td>${esc(r.o.n)}</td><td>${esc(LVN[r.o.lv||"core"]||"")}</td><td>${esc(r.o.d)}</td><td>${+r.o.xp||0}</td>${T.map(t=>{const x=r.o.t[t.id]||{};if(!x.cp)return`<td>not done<br><small>(${+x.p||0}%)${x.ab?" · left early: "+(+x.ab):""}</small></td>`;const f=x.cp[0]/x.cp[1],bg=f>=.8?"#dcebd2":f>=.6?"#f6e8c3":"#f3d9d0";return`<td style="background:${bg}">${+x.cp[0]}/${+x.cp[1]}<br><small>(${+x.p}%)${x.ab?" · left early: "+(+x.ab):""}</small></td>`}).join("")}<td>${r.ok?"✓":"⚠ edited"}</td></tr>`).join("")}</table></div><button class="btn p" onclick="dlClass()">Download class results (CSV)</button>`}
let CLS=[];
function dlClass(){const q=v=>'"'+String(v??"").replace(/"/g,'""')+'"',h=["Student","Date","Reading support","XP","Topic","Progress %","Evidence label","Checkpoint correct","Checkpoint questions","Checkpoint date","Checkpoint attempts","First-attempt correct","First-attempt questions","Boss defeated","Corrected after feedback","Retried questions","Checkpoint left early","Code check"],o=[h.map(q).join(",")];
CLS.forEach(r=>T.forEach(t=>{const x=r.o.t[t.id]||{},c=x.cp||["","","",""];o.push([r.o.n,r.o.d,LVN[r.o.lv||"core"],r.o.xp,t.name,x.p,x.l,c[0],c[1],c[2],c[3],(x.fa||[])[0],(x.fa||[])[1],x.b?"Yes":"No",(x.rt||[])[0],(x.rt||[])[1],x.ab||0,r.ok?"OK":"Edited"].map(q).join(","))}));saveText("class-results.csv",o.join("\n"),"text/csv")}
